version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-twam_db}
      POSTGRES_USER: ${DB_USER:-twam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-twam_password}
    ports:
      - "5432:5432"

  backend:
    build: .
    restart: always
    expose:
      - "8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME:-twam_db}
      - DB_USER=${DB_USER:-twam_user}
      - DB_PASSWORD=${DB_PASSWORD:-twam_password}
      - DB_HOST=db
      - DB_PORT=5432
      # Add any other required environment variables here
      # - SECRET_KEY=${SECRET_KEY}
      # - DEBUG=${DEBUG:-0}

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/nginx/ssl
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot



volumes:
  postgres_data:
